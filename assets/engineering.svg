<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">Engineering principles from intent to delivery</title>
  <desc id="desc">A five-stage software engineering process: product intent, API rules, data integrity, verification, and careful delivery.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#DCEFA2"/><stop offset="1" stop-color="#83BBB9"/></linearGradient>
  </defs>
  <rect width="720" height="200" rx="14" fill="#101618"/>
  <rect x="1" y="1" width="718" height="198" rx="13" fill="none" stroke="#3F5251"/>
  <text x="24" y="28" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#B5C6C0" letter-spacing="2.4">ENGINEERING PROCESS  /  05 STAGES</text>
  <path d="M72 104H648" stroke="#536965" stroke-width="3"/>
  <path d="M72 104H648" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 19"/>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">
    <g fill="#171F20" stroke="#6D8C80" stroke-width="3"><circle cx="72" cy="104" r="16"/><circle cx="216" cy="104" r="16"/><circle cx="360" cy="104" r="16"/><circle cx="504" cy="104" r="16"/><circle cx="648" cy="104" r="16"/></g>
    <g fill="#DCEFA2"><circle cx="72" cy="104" r="5"/><circle cx="216" cy="104" r="5"/><circle cx="360" cy="104" r="5"/><circle cx="504" cy="104" r="5"/><circle cx="648" cy="104" r="5"/></g>
    <g fill="#EAF0EA" font-size="24"><text x="72" y="70">Intent</text><text x="216" y="156">Rules</text><text x="360" y="70">Data</text><text x="504" y="156">Verify</text><text x="648" y="70">Deliver</text></g>
    <g fill="#91AAA0" font-size="11" font-weight="400" letter-spacing="1.6"><text x="72" y="158">PRODUCT</text><text x="216" y="70">API</text><text x="360" y="158">INTEGRITY</text><text x="504" y="70">THE CHANGE</text><text x="648" y="158">CAREFULLY</text></g>
  </g>
